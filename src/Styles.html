<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #16233A;
  --ink-2: #3E4B60;
  --muted: #646F82;
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --line: #DDE1E8;
  --line-strong: #C4CAD5;
  --brand: #1B2E52;
  --brand-ink: #13223F;
  --brand-tint: #E7EBF3;
  --accent: #C9A227;
  --accent-ink: #8A6A10;
  --accent-tint: #FBF4DF;
  --danger: #B42318;
  --danger-tint: #FCEBE9;
  --warn: #9A4D06;
  --warn-tint: #FDF1E1;
  --ok: #1D7247;
  --ok-tint: #E4F3EA;
  --info: #2C5A97;
  --info-tint: #E7EEF8;
  --neutral-tint: #ECEEF2;
  --g-personal: #1B2E52;
  --g-documentos: #4A6FA5;
  --g-operacion: #A27B12;
  --g-evaluaciones: #7A3E8E;
  --radius-s: 6px;
  --radius: 10px;
  --shadow-pop: 0 12px 32px rgba(16, 28, 54, .18);
  --sidebar: 268px;
  --top: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand-ink); }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.12rem; font-weight: 600; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid #6F8FCB; outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Estructura ---------- */
.top {
  position: fixed; inset: 0 0 auto 0; height: var(--top); z-index: 30;
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
  background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 0 -2px 0 var(--accent);
}
.brand { display: flex; align-items: center; gap: 14px; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; flex: none; }
.brand-logo { height: 38px; width: auto; display: block; }
.brand-divider { width: 1px; height: 30px; background: var(--line-strong); }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-name { font-weight: 700; font-size: .95rem; }
.brand-sub { color: var(--muted); font-size: .8rem; }
.icon-btn.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input {
  width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 19px; padding: 0 14px 0 38px;
  background: var(--bg);
}
.search input:focus { background: var(--surface); border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-tint); }
.search svg { position: absolute; left: 13px; top: 11px; width: 16px; height: 16px; color: var(--muted); }
.search-results {
  position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-pop); max-height: 60vh; overflow: auto; padding: 6px;
}
.search-results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: var(--radius-s); cursor: pointer; }
.search-results button:hover, .search-results button.active { background: var(--brand-tint); }
.search-results .meta { color: var(--muted); font-size: .82rem; }
.me { margin-left: auto; text-align: right; line-height: 1.25; }
.me-name { font-weight: 600; font-size: .9rem; }
.me-role { color: var(--muted); font-size: .8rem; }

.side {
  position: fixed; top: var(--top); bottom: 0; left: 0; width: var(--sidebar); overflow-y: auto; z-index: 20;
  background: var(--surface); border-right: 1px solid var(--line); padding: 14px 12px 28px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; cursor: pointer;
  padding: 7px 10px; border-radius: var(--radius-s); text-align: left; color: var(--ink-2); font-size: .92rem;
}
.nav-item:hover { background: var(--bg); color: var(--ink); }
.nav-item.active { background: var(--brand-tint); color: var(--brand-ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav-item > svg { width: 18px; height: 18px; flex: none; }
.nav-item .count { margin-left: auto; font-size: .78rem; color: var(--muted); font-weight: 500; }
.nav-item.active .count { color: var(--brand-ink); }
.nav-group { margin-top: 18px; }
.nav-group-title { display: flex; align-items: center; gap: 8px; padding: 0 10px 6px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.nav-group-title i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.nav-lock { margin-left: auto; width: 13px; height: 13px; color: var(--muted); }

.side-scrim { display: none; }
.credit { max-width: 1180px; margin: 56px auto 0; padding-top: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: .8rem; }
.credit img { height: 26px; width: auto; display: block; }
.state-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.state-logo { height: 54px; width: auto; }
.state-wrap .credit { margin-top: 8px; border-top: 0; padding-top: 0; }
.main { margin-left: var(--sidebar); padding: calc(var(--top) + 28px) 36px 64px; min-height: 100vh; }
.page { max-width: 1180px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head .lead { color: var(--ink-2); margin-top: 6px; max-width: 70ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.group-tag { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.group-tag i { width: 8px; height: 8px; border-radius: 2px; }

/* ---------- Controles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px;
  border-radius: var(--radius-s); border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer;
  font-weight: 600; font-size: .9rem; white-space: nowrap; color: var(--ink);
}
.btn:hover { border-color: var(--ink-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-ink); }
.btn.danger { color: var(--danger); border-color: #E7B7B2; }
.btn.danger:hover { background: var(--danger-tint); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--bg); }
.btn.small { height: 32px; padding: 0 11px; font-size: .84rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-s); border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--bg); }
.icon-btn svg { width: 20px; height: 20px; }

label.field { display: flex; flex-direction: column; gap: 5px; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
label.field .req { color: var(--danger); font-weight: 700; }
label.field .hint { font-weight: 400; color: var(--muted); font-size: .8rem; }
.input, select.input, textarea.input {
  width: 100%; min-height: 40px; border: 1px solid var(--line-strong); border-radius: var(--radius-s); background: var(--surface);
  padding: 8px 11px; font-weight: 400; color: var(--ink);
}
textarea.input { min-height: 92px; resize: vertical; }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
.input[readonly], .input:disabled { background: var(--bg); color: var(--ink-2); }
.input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-tint); }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--brand); }

.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius-s); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: .86rem; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; font-weight: 600; }

/* ---------- Estados ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-tint); color: var(--ok); }
.badge.warn { background: var(--warn-tint); color: var(--warn); }
.badge.danger { background: var(--danger-tint); color: var(--danger); }
.badge.info { background: var(--info-tint); color: var(--info); }
.badge.neutral { background: var(--neutral-tint); color: var(--ink-2); }
.badge.plain::before { display: none; }

/* ---------- Inicio ---------- */
.hello { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 26px; }
.hello .date { color: var(--ink-2); margin-top: 4px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
.quick .btn { height: 40px; }
.agenda { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.lane { padding: 18px 18px 14px; border-right: 1px solid var(--line); min-height: 220px; }
.lane:last-child { border-right: 0; }
.lane-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.lane-head h2 { font-size: 1rem; }
.lane-head .n { font-size: 1.9rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.lane.overdue .n { color: var(--danger); }
.lane.week .n { color: var(--warn); }
.lane.soon .n { color: var(--info); }
.lane-sub { color: var(--muted); font-size: .82rem; margin: -8px 0 12px; }
.task {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; cursor: pointer;
  border: 0; border-top: 1px solid var(--line); background: none; padding: 9px 2px;
}
.task:hover .t-title { color: var(--brand-ink); text-decoration: underline; }
.task .t-title { font-weight: 600; font-size: .92rem; }
.task .t-mod { color: var(--muted); font-size: .8rem; grid-column: 1; }
.task .t-date { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: .82rem; color: var(--ink-2); text-align: right; }
.lane.overdue .t-date { color: var(--danger); font-weight: 600; }
.lane-empty { color: var(--muted); font-size: .9rem; padding: 14px 0; border-top: 1px solid var(--line); }
.lane-more { margin-top: 8px; }

.split { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; margin-top: 28px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
.panel h2 { margin-bottom: 12px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.fact { padding: 4px 0; }
.fact b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.fact span { color: var(--ink-2); font-size: .86rem; }
.fact button { border: 0; background: none; padding: 0; color: var(--brand-ink); text-decoration: underline; cursor: pointer; font-size: .82rem; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { padding: 9px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.feed li:first-child { border-top: 0; }
.feed .who { color: var(--muted); font-size: .8rem; }
.feed button { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; text-align: left; }
.feed button:hover { color: var(--brand-ink); text-decoration: underline; }

/* ---------- Módulo ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar .input { width: auto; min-height: 38px; }
.toolbar .filter-q { flex: 1 1 240px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 12px; cursor: pointer; font-size: .84rem; color: var(--ink-2); }
.chip b { font-weight: 600; margin-left: 4px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip[aria-pressed="true"] b { color: #C9D6D4; }
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; font-size: .8rem; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: #FAFBFB; }
table.list td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: .9rem; }
table.list tr:last-child td { border-bottom: 0; }
table.list tbody tr { cursor: pointer; }
table.list tbody tr:hover { background: #F7FAF9; }
.cell-title { font-weight: 600; }
.cell-sub { color: var(--muted); font-size: .82rem; }
.late { color: var(--danger); font-weight: 600; }
.progress { height: 6px; background: var(--neutral-tint); border-radius: 3px; overflow: hidden; width: 110px; }
.progress span { display: block; height: 100%; background: var(--brand); }
.stock-low { color: var(--danger); font-weight: 700; }
.empty { text-align: center; padding: 56px 20px; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); }
.empty h2 { margin-bottom: 6px; }
.empty p { color: var(--ink-2); margin-bottom: 16px; }
.list-foot { color: var(--muted); font-size: .84rem; margin-top: 10px; }

/* Calendario */
.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cal-head h2 { min-width: 200px; text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.cal .dow { font-size: .78rem; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); background: #FAFBFB; }
.cal .day { min-width: 0; min-height: 104px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; }
.cal .day:nth-child(7n) { border-right: 0; }
.cal .day.out { background: #FAFBFB; color: var(--muted); }
.cal .day.today .d { background: var(--brand); color: #fff; border-radius: 50%; }
.cal .d { font-size: .8rem; width: 24px; height: 24px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.cal .ev { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; margin-top: 3px; padding: 2px 6px; border-radius: 4px; font-size: .76rem; background: var(--brand-tint); color: var(--brand-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .ev.cancel { background: var(--neutral-tint); color: var(--muted); text-decoration: line-through; }
.cal .more { font-size: .74rem; color: var(--muted); margin-top: 3px; }

/* ---------- Panel lateral (editor) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(16, 28, 54, .34); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); z-index: 50; background: var(--surface);
  display: flex; flex-direction: column; box-shadow: var(--shadow-pop);
  animation: slide .18s ease-out;
}
@keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.d-head { padding: 18px 24px 0; border-bottom: 1px solid var(--line); }
.d-head .row { display: flex; align-items: flex-start; gap: 12px; }
.d-head .kicker { color: var(--muted); font-size: .84rem; }
.d-head h2 { font-size: 1.3rem; margin-top: 2px; }
.tabs { display: flex; gap: 4px; margin-top: 14px; }
.tabs button { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: .9rem; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--brand-ink); border-bottom-color: var(--brand); }
.d-body { flex: 1; overflow-y: auto; padding: 22px 24px 30px; }
.d-foot { border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface); }
.d-foot .spacer { flex: 1; }
.d-foot .msg { flex-basis: 100%; font-size: .88rem; }
.msg.error { color: var(--danger); font-weight: 600; }
.msg.okay { color: var(--ok); font-weight: 600; }
.section { margin-bottom: 24px; }
.section > h3 { margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.grid2 .wide { grid-column: 1 / -1; }
.notice { padding: 11px 14px; border-radius: var(--radius-s); font-size: .88rem; margin-bottom: 16px; }
.notice.info { background: var(--info-tint); color: #1F4677; }
.notice.warn { background: var(--warn-tint); color: #7A3D05; }
.notice.lock { background: var(--neutral-tint); color: var(--ink-2); }
.picker { position: relative; }
.picker-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); box-shadow: var(--shadow-pop); max-height: 260px; overflow: auto; margin-top: 4px; }
.picker-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 11px; cursor: pointer; font-size: .9rem; }
.picker-list button:hover { background: var(--brand-tint); }
.checklist { display: flex; flex-direction: column; }
.check-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.check-row:first-child { border-top: 0; }
.check-row span { flex: 1; font-size: .92rem; }
.check-row.done span { color: var(--ink-2); }
.files { list-style: none; padding: 0; margin: 12px 0 0; }
.files li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.files li .grow { flex: 1; min-width: 0; }
.files li .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--ink-2); }
.drop.over { border-color: var(--brand); background: var(--brand-tint); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { padding: 10px 0 10px 18px; border-left: 2px solid var(--line); position: relative; }
.timeline li::before { content: ''; position: absolute; left: -6px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--brand); }
.timeline .when { color: var(--muted); font-size: .8rem; }

/* Evaluaciones */
.q { padding: 12px 0; border-top: 1px solid var(--line); }
.q-text { font-size: .93rem; margin-bottom: 8px; }
.q-sec { font-weight: 700; font-size: .86rem; color: var(--g-evaluaciones); margin: 18px 0 4px; }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.scale label { position: relative; }
.scale input { position: absolute; opacity: 0; }
.scale span { display: inline-block; padding: 5px 11px; border: 1px solid var(--line-strong); border-radius: 99px; font-size: .82rem; cursor: pointer; }
.scale input:checked + span { background: var(--g-evaluaciones); border-color: var(--g-evaluaciones); color: #fff; font-weight: 600; }
.scale input:focus-visible + span { outline: 3px solid #C9A6D3; }
.eval-progress { position: sticky; top: -22px; background: var(--surface); padding: 8px 0; z-index: 2; display: flex; align-items: center; gap: 10px; font-size: .86rem; color: var(--ink-2); }
.eval-progress .progress { flex: 1; width: auto; }
.result { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; }
.result .big { font-size: 1.4rem; font-weight: 700; }

/* Modal */
.modal { position: fixed; z-index: 60; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-pop); padding: 22px; }
.modal h2 { margin-bottom: 14px; }
.modal .row-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.modal .stack { display: flex; flex-direction: column; gap: 12px; }

/* Avisos */
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--radius-s); box-shadow: var(--shadow-pop); font-size: .9rem; max-width: 90vw; }
.toast.error { background: var(--danger); }

/* Pantallas de estado */
.center { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
