<script>
'use strict';
/* =========================================================================
   Intranet de Capital Humano: interfaz.
   Todo el texto proveniente de datos se inserta con textContent (sin HTML).
   ========================================================================= */

var S = {
  boot: null,
  data: { records: [], attachments: [], movements: [], activity: [] },
  view: { name: 'home', moduleId: null },
  filters: {},
  cal: {},
  drawer: null,
  expanded: {},
};

/* ---------- Utilidades ---------- */

function el(tag, attrs) {
  var node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'style') node.setAttribute('style', v);
    else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
    else if (k === 'value') node.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'readOnly' || k === 'selected' || k === 'multiple') node[k] = !!v;
    else node.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) append(node, arguments[i]);
  return node;
}
function append(node, kid) {
  if (kid === null || kid === undefined || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function (k) { append(node, k); }); return; }
  node.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

var ICONS = {

  link: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',
  refresh: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',
  home: 'M4 11 12 4l8 7v9h-5v-6H9v6H4z',
  users: 'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',
  left: 'M15 6l-6 6 6 6',
  right: 'M9 6l6 6-6 6',
  down: 'M6 9l6 6 6-6',
  box: 'M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8',

  heart: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',
  external: 'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
  grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  cap: 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5',
  clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
  cross: 'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',
};
function icon(name) {
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.8');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', ICONS[name] || '');
  svg.appendChild(path);
  return svg;
}

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      var msg = (e && e.message) || String(e);
      reject(new Error(msg.replace(/^(Exception|Error):\s*/i, '')));
    });
    runner[fn].apply(runner, args);
  });
}

function toast(message, kind) {
  var t = el('div', { class: 'toast' + (kind === 'error' ? ' error' : ''), role: kind === 'error' ? 'alert' : 'status', text: message });
  document.getElementById('toasts').appendChild(t);
  setTimeout(function () { t.remove(); }, kind === 'error' ? 7000 : 3200);
}

var MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var MONTHS_LONG = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var DAYS_LONG = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

function parseDay(s) {
  var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
}
function isoDay(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtDate(s) {
  var d = parseDay(s);
  return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() : '';
}
function daysFromToday(s) {
  var d = parseDay(s), t = parseDay(S.boot.today);
  return d && t ? Math.round((d - t) / 86400000) : null;
}
function relDay(s) {
  var n = daysFromToday(s);
  if (n === null) return '';
  if (n === 0) return 'Hoy';
  if (n === 1) return 'Mañana';
  if (n === -1) return 'Ayer';
  if (n < 0) return 'Hace ' + -n + ' días';
  if (n < 7) return 'En ' + n + ' días';
  return fmtDate(s);
}
function timeAgo(iso) {
  var diff = (Date.now() - new Date(iso).getTime()) / 60000;
  if (diff < 1) return 'hace un momento';
  if (diff < 60) return 'hace ' + Math.round(diff) + ' min';
  if (diff < 1440) return 'hace ' + Math.round(diff / 60) + ' h';
  var d = new Date(iso);
  return d.getDate() + ' ' + MONTHS[d.getMonth()];
}
function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function bytes(n) {
  return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}

/* ---------- Catálogo y permisos (la validación definitiva ocurre en el servidor) ---------- */

function mods() { return S.boot.catalog.modules; }
function modById(id) { return mods().filter(function (m) { return m.id === id; })[0] || null; }
function groupColor(g) { return 'var(--g-' + g + ')'; }
function recordsOf(kind) { return S.data.records.filter(function (r) { return r.kind === kind; }); }
function recById(id) { return S.data.records.filter(function (r) { return r.id === id; })[0] || null; }
function hasField(mod, key) { return mod.fields.some(function (f) { return f.key === key; }); }

function canWriteRecord(r) {
  var mod = modById(r.kind), cat = S.boot.catalog, u = S.boot.user;
  if (!mod || !mod.canWrite) return false;
  if (r.company === cat.allCompanies) { if (!u.canWriteCommon) return false; }
  else if (cat.writableCompanies.indexOf(r.company) === -1) return false;
  if (r.site !== cat.allSites && cat.writableSites.indexOf(r.site) === -1) return false;
  return true;
}

var CLOSED = ['Concluido', 'Cancelado', 'Cancelada', 'Archivado', 'Completado', 'Realizado', 'Cubierta', 'No autorizado', 'No autorizada',
  'Contratado', 'No seleccionado', 'Desistió', 'Baja', 'Finalizada', 'Atendido', 'Emitida', 'Justificada', 'Justificado',
  'Injustificada', 'Injustificado', 'Autorizado', 'Autorizada', 'Completo'];
var EXPIRING = ['contratos', 'especialistas'];

function isOpen(r) {
  var mod = modById(r.kind);
  if (!mod || mod.mode === 'documentos' || mod.mode === 'inventario') return false;
  if (EXPIRING.indexOf(r.kind) !== -1) return ['Concluido', 'Cancelado', 'Archivado', 'Vencido'].indexOf(r.status) === -1;
  return CLOSED.indexOf(r.status) === -1;
}

var TONES = {
  ok: ['Activo', 'Vigente', 'Completo', 'Autorizado', 'Autorizada', 'Concluido', 'Realizado', 'Completado', 'Cubierta', 'Contratado', 'Emitida',
    'Justificada', 'Justificado', 'Atendido', 'Finalizada', 'Confirmado'],
  warn: ['Pendiente', 'Por renovar', 'Por vencer', 'En conciliación', 'Oferta', 'Borrador'],
  info: ['Nuevo', 'Registrado', 'Registrada', 'Programado', 'En revisión', 'En seguimiento', 'Entrevista', 'Evaluación', 'En proceso',
    'En reclutamiento', 'En reparto'],
  danger: ['Baja', 'No autorizado', 'No autorizada', 'Injustificada', 'Injustificado', 'Vencido', 'No seleccionado', 'Desistió'],
};
function badge(status) {
  var tone = 'neutral';
  Object.keys(TONES).forEach(function (t) { if (TONES[t].indexOf(status) !== -1) tone = t; });
  return el('span', { class: 'badge ' + tone, text: status });
}

function balanceOf(r) {
  var p = r.payload || {};
  return Number(p.balance === undefined || p.balance === '' ? p.initial : p.balance) || 0;
}
function checklistScore(mod, p) {
  var checks = (p && p.checks) || {};
  var applicable = (mod.checks || []).filter(function (c) { return checks[c] !== 'No aplica'; });
  var done = applicable.filter(function (c) { return checks[c] === 'Completo'; });
  return { done: done.length, total: applicable.length, pct: applicable.length ? Math.round(done.length / applicable.length * 100) : 0 };
}
function subtitle(r) {
  var p = r.payload || {}, parts = [];
  if (r.folio) parts.push(r.folio);
  if (p.employeeId) parts.push('No. ' + p.employeeId);
  if (p.position) parts.push(p.position);
  else if (p.area) parts.push(p.area);
  if (r.kind === 'uniformes') parts.push('Talla ' + (p.size || '—') + (p.sku ? ', ' + p.sku : ''));
  return parts.join(', ');
}
function place(r) {
  return (r.company === S.boot.catalog.allCompanies ? 'Todas las empresas' : r.company) + ', ' + (r.site === S.boot.catalog.allSites ? 'todas las sedes' : r.site);
}

/* ---------- Arranque ---------- */

function start() {
  api('apiBootstrap').then(function (boot) {
    if (boot.state !== 'ok') return renderState(boot);
    S.boot = boot;
    return api('apiLoad').then(function (data) {
      S.data = data;
      renderShell();
      go('home');
    });
  }).catch(function (e) {
    renderState({ state: 'error', message: e.message });
  });
}

function renderState(b) {
  var app = clear(document.getElementById('app'));
  var title, lines;
  if (b.state === 'no-email') {
    title = 'No pudimos identificar tu cuenta';
    lines = ['Entra con la cuenta de Google de la empresa. Si ya lo hiciste, pide a Capital Humano que revise la configuración de la plataforma: tu cuenta y la plataforma deben pertenecer al mismo dominio de Google Workspace.'];
  } else if (b.state === 'no-access') {
    title = 'Tu cuenta aún no tiene acceso';
    lines = ['Entraste como ' + b.email + '.', 'Pide a Dirección de Capital Humano que te asigne un rol, empresas y sedes. Después recarga esta página.'];
  } else if (b.state === 'not-installed') {
    title = 'La plataforma aún no está instalada';
    lines = ['Abre el proyecto en el editor de Apps Script y ejecuta la función "instalar" una sola vez con la cuenta propietaria.'];
  } else {
    title = 'No fue posible cargar la intranet';
    lines = [b.message || 'Error desconocido.', 'Recarga la página. Si el problema continúa, avisa a Capital Humano.'];
  }
  app.appendChild(el('div', { class: 'center' }, el('div', { class: 'state-wrap' },
    el('img', { class: 'state-logo', src: LOGO_SLH, alt: 'Saint Luke’s Hospitals' }), el('div', { class: 'state-card' },
    el('h1', { text: title }), lines.map(function (l) { return el('p', { text: l }); }),
    el('button', { class: 'btn', onclick: function () { location.reload(); } }, 'Recargar')), credit())));
}

function reload(quiet) {
  return api('apiLoad').then(function (data) {
    S.data = data;
    renderSide();
    renderMain();
    if (!quiet) toast('Datos actualizados');
  }).catch(function (e) { toast(e.message, 'error'); });
}

/* ---------- Estructura ---------- */

function renderShell() {
  var u = S.boot.user;
  var app = clear(document.getElementById('app'));
  app.appendChild(el('header', { class: 'top' },
    el('button', { class: 'icon-btn menu-btn', 'aria-label': 'Abrir menú', onclick: function () { document.body.classList.toggle('nav-open'); } }, icon('menu')),
    el('button', { class: 'brand', 'aria-label': 'Ir al inicio', onclick: function () { go('home'); } },
      el('img', { class: 'brand-logo', src: LOGO_SLH, alt: 'Saint Luke’s Hospitals' }),
      el('span', { class: 'brand-divider', 'aria-hidden': 'true' }),
      el('span', { class: 'brand-text' }, el('span', { class: 'brand-name', text: 'Capital Humano' }), el('span', { class: 'brand-sub', text: 'Intranet RH' }))),
    buildSearch(),
    el('button', { class: 'icon-btn', title: 'Actualizar datos', 'aria-label': 'Actualizar datos', onclick: function () { reload(false); } }, icon('refresh')),
    el('div', { class: 'me' }, el('div', { class: 'me-name', text: u.name }), el('div', { class: 'me-role', text: u.role + (u.titular ? ', titular' : '') }))
  ));
  app.appendChild(el('div', { class: 'side-scrim', onclick: function () { document.body.classList.remove('nav-open'); } }));
  app.appendChild(el('nav', { class: 'side', id: 'side', 'aria-label': 'Secciones' }));
  app.appendChild(el('main', { class: 'main', id: 'main' }));
  app.appendChild(el('div', { id: 'drawer-root' }));
  app.appendChild(el('div', { id: 'modal-root' }));
}

function go(name, moduleId) {
  S.view = { name: name, moduleId: moduleId || null };
  document.body.classList.remove('nav-open');
  renderSide();
  renderMain();
  window.scrollTo(0, 0);
}

function renderSide() {
  var side = clear(document.getElementById('side'));
  var v = S.view;
  side.appendChild(el('button', { class: 'nav-item' + (v.name === 'home' ? ' active' : ''), onclick: function () { go('home'); } }, icon('home'), 'Inicio'));
  side.appendChild(el('button', { class: 'nav-item' + (v.name === 'platforms' ? ' active' : ''), onclick: function () { go('platforms'); } }, icon('grid'), 'Plataformas'));
  S.boot.catalog.groups.forEach(function (g) {
    var list = mods().filter(function (m) { return m.group === g.id && m.id !== 'plataformas'; });
    if (!list.length) return;
    var box = el('div', { class: 'nav-group' }, el('div', { class: 'nav-group-title' }, el('i', { style: 'background:' + groupColor(g.id) }), g.label));
    if (g.id === 'personal' && modById('colaboradores')) {
      [['directory', 'Directorio'], ['org', 'Organigrama']].forEach(function (pv) {
        box.appendChild(el('button', {
          class: 'nav-item' + (v.name === pv[0] ? ' active' : ''), 'aria-current': v.name === pv[0] ? 'page' : null,
          onclick: function () { go(pv[0]); },
        }, pv[1]));
      });
    }
    list.forEach(function (m) {
      var open = recordsOf(m.id).filter(isOpen).length;
      box.appendChild(el('button', {
        class: 'nav-item' + (v.name === 'module' && v.moduleId === m.id ? ' active' : ''),
        'aria-current': v.name === 'module' && v.moduleId === m.id ? 'page' : null,
        onclick: function () { go('module', m.id); },
      }, m.label, m.id === 'evaluaciones' || m.id === 'incapacidades' ? (function () { var i = icon('lock'); i.setAttribute('class', 'nav-lock'); i.setAttribute('aria-label', 'Confidencial'); return i; })() : null,
        open ? el('span', { class: 'count', text: open }) : null));
    });
    side.appendChild(box);
  });
  if (S.boot.user.admin) {
    side.appendChild(el('div', { class: 'nav-group' },
      el('button', { class: 'nav-item' + (v.name === 'admin' ? ' active' : ''), onclick: function () { go('admin'); } }, icon('users'), 'Usuarios y permisos')));
  }
}

function credit() {
  return el('footer', { class: 'credit' }, el('span', { text: 'Creado por' }),
    el('img', { src: LOGO_RHINO, alt: 'RHINOBUILD' }));
}

function renderMain() {
  var main = clear(document.getElementById('main'));
  var page = el('div', { class: 'page' });
  main.appendChild(page);
  main.appendChild(credit());
  if (S.view.name === 'home') viewHome(page);
  else if (S.view.name === 'module') viewModule(page, modById(S.view.moduleId));
  else if (S.view.name === 'admin') viewAdmin(page);
  else if (S.view.name === 'platforms') viewPlatforms(page);
  else if (S.view.name === 'directory') viewDirectory(page);
  else if (S.view.name === 'org') viewOrg(page);
}

/* ---------- Búsqueda global ---------- */

function buildSearch() {
  var wrap = el('div', { class: 'search', role: 'search' });
  var results = null, active = 0, matches = [];
  var input = el('input', { type: 'search', placeholder: 'Buscar persona, folio o número de empleado', 'aria-label': 'Buscar en la intranet', autocomplete: 'off' });
  function close() { if (results) { results.remove(); results = null; } }
  function draw() {
    close();
    var q = norm(input.value.trim());
    if (q.length < 2) return;
    matches = S.data.records.filter(function (r) {
      var p = r.payload || {};
      return norm([r.title, r.folio, p.employeeId, p.position, p.area, p.folio].join(' ')).indexOf(q) !== -1;
    }).slice(0, 8);
    results = el('div', { class: 'search-results', role: 'listbox' });
    if (!matches.length) results.appendChild(el('p', { class: 'meta', style: 'padding:8px 10px', text: 'Sin resultados para "' + input.value.trim() + '".' }));
    matches.forEach(function (r, i) {
      var mod = modById(r.kind);
      results.appendChild(el('button', {
        class: i === active ? 'active' : '', role: 'option',
        onmousedown: function (e) { e.preventDefault(); close(); input.value = ''; openRecord(r); },
      }, el('div', { text: r.title }), el('div', { class: 'meta', text: (mod ? mod.label : r.kind) + ', ' + place(r) })));
    });
    wrap.appendChild(results);
  }
  input.addEventListener('input', function () { active = 0; draw(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { input.value = ''; close(); }
    if (e.key === 'ArrowDown' && matches.length) { active = Math.min(active + 1, matches.length - 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp' && matches.length) { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
    if (e.key === 'Enter' && matches[active]) { var r = matches[active]; close(); input.value = ''; openRecord(r); }
  });
  input.addEventListener('blur', function () { setTimeout(close, 150); });
  wrap.appendChild(icon('search'));
  wrap.appendChild(input);
  return wrap;
}

/* ---------- Inicio ---------- */

var QUICK = [
  { kind: 'permisos', label: 'Registrar permiso' },
  { kind: 'incapacidades', label: 'Registrar incapacidad' },
  { kind: 'constancias', label: 'Emitir constancia' },
  { kind: 'cobertura', label: 'Solicitar cobertura' },
  { kind: 'colaboradores', label: 'Dar de alta colaborador' },
  { kind: 'candidatos', label: 'Agregar candidato' },
  { kind: 'calendario-cap', label: 'Programar capacitación' },
];

function viewHome(page) {
  var u = S.boot.user;
  var today = parseDay(S.boot.today);
  var hour = new Date().getHours();
  var hi = hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches';
  var quick = QUICK.filter(function (q) { var m = modById(q.kind); return m && m.canWrite; }).slice(0, 4);
  var featured = allPlatforms().filter(function (pl) { return pl.featured; }).slice(0, 6);
  page.appendChild(el('section', { class: 'hero' },
    el('div', { class: 'hero-main' },
      el('div', { class: 'hero-kicker', text: 'Capital Humano · Grupo Saint Luke’s' }),
      el('h1', { text: /^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+ /.test(u.name) && u.name !== 'Dirección RH' ? hi + ', ' + u.name.split(' ')[0] + '.' : hi + '.' }),
      el('p', { class: 'date', text: DAYS_LONG[today.getDay()].charAt(0).toUpperCase() + DAYS_LONG[today.getDay()].slice(1) + ' ' + today.getDate() + ' de ' + MONTHS_LONG[today.getMonth()] + '. Esto es lo que requiere atención hoy.' }),
      quick.length ? el('div', { class: 'hero-actions' }, quick.map(function (q, i) {
        return el('button', { class: 'btn ' + (i === 0 ? 'light' : 'outline-light'), onclick: function () { openNew(q.kind); } }, icon('plus'), q.label);
      })) : null),
    featured.length ? el('div', { class: 'hero-card' },
      el('h2', { text: 'Accesos rápidos' }),
      el('div', { class: 'hero-plats' }, featured.map(function (pl) { return platformTile(pl, true); })),
      el('button', { class: 'hero-more', onclick: function () { go('platforms'); } }, 'Ver todas las plataformas', icon('right'))) : null));

  var open = S.data.records.filter(function (r) { return r.due && isOpen(r); });
  var lanes = [
    { id: 'overdue', title: 'Vencidos', sub: 'Fecha compromiso ya pasó', test: function (n) { return n < 0; } },
    { id: 'week', title: 'Esta semana', sub: 'De hoy a 7 días', test: function (n) { return n >= 0 && n <= 7; } },
    { id: 'soon', title: 'Próximos 30 días', sub: 'Para planear con tiempo', test: function (n) { return n > 7 && n <= 30; } },
  ];
  var agenda = el('section', { class: 'agenda', 'aria-label': 'Pendientes por fecha' });
  lanes.forEach(function (lane) {

/** Arma el árbol: jefe por número de empleado; si no hay número, por nombre exacto. Rompe ciclos. */
function buildOrg(people) {
  var byId = {}, byName = {}, parent = {}, kids = {};
  people.forEach(function (r) {
    var id = String(r.payload.employeeId || '').toUpperCase();
    if (id) byId[id] = r;
    var n = norm(r.title);
    byName[n] = byName[n] === undefined ? r : null; // nombres repetidos no se usan para enlazar
  });
  people.forEach(function (r) {
    var p = r.payload, boss = null;
    if (p.managerId) boss = byId[String(p.managerId).toUpperCase()] || null;
    if (!boss && p.manager) boss = byName[norm(p.manager)] || null;
    parent[r.id] = boss && boss.id !== r.id ? boss.id : null;
  });
  people.forEach(function (r) {
    var seen = {}, cur = r.id, steps = 0;
    while (parent[cur] && steps++ < people.length) {
      if (seen[cur]) { parent[r.id] = null; break; }
      seen[cur] = true;
      cur = parent[cur];
      if (cur === r.id) { parent[r.id] = null; break; }
    }
  });
  people.forEach(function (r) { kids[r.id] = []; });
  people.forEach(function (r) { if (parent[r.id]) kids[parent[r.id]].push(r); });
  Object.keys(kids).forEach(function (k) { kids[k].sort(function (a, b) { return a.title.localeCompare(b.title, 'es'); }); });
  var size = {};
  function count(id) { if (size[id] !== undefined) return size[id]; size[id] = 0; var n = 0; kids[id].forEach(function (c) { n += 1 + count(c.id); }); size[id] = n; return n; }
  people.forEach(function (r) { count(r.id); });
  var roots = people.filter(function (r) { return !parent[r.id]; });
  return {
    parent: parent, kids: kids, size: size,
    leaders: roots.filter(function (r) { return kids[r.id].length; }).sort(function (a, b) { return size[b.id] - size[a.id]; }),
    loose: roots.filter(function (r) { return !kids[r.id].length; }).sort(function (a, b) { return a.title.localeCompare(b.title, 'es'); }),
  };
}

function viewOrg(page) {
  page.appendChild(personHead('personal', 'Organigrama', 'Se arma con el jefe inmediato de cada colaborador en el padrón. Para mover a alguien, edita su "Número de empleado del jefe inmediato".'));

    companies.length > 1 ? selectInput(null, f.company, function (v) { f.company = v; f.open = {}; draw(); }, companies, 'Empresa') : null,
    el('div', { class: 'seg', role: 'group', 'aria-label': 'Niveles' },
      el('button', { onclick: function () { Object.keys(tree.kids).forEach(function (k) { if (tree.kids[k].length) f.open[k] = true; }); draw(); } }, 'Expandir todo'),
      el('button', { onclick: function () { Object.keys(f.open).forEach(function (k) { f.open[k] = false; }); draw(); } }, 'Contraer'))));
  var box = el('div');

        hits[r.id] = true;
        var cur = tree.parent[r.id], guard = 0;

      });
    }
    function isOpenNode(r, depth) {

      if (f.open[r.id] !== undefined) return f.open[r.id];

    }
    function node(r, depth) {

      var li = el('li', null,

          k.length ? el('button', { class: 'icon-btn org-toggle', 'aria-expanded': String(!!open), 'aria-label': (open ? 'Contraer' : 'Expandir') + ' equipo de ' + r.title,
            onclick: function () { f.open[r.id] = !open; draw(); } }, icon(open ? 'down' : 'right')) : el('span', { class: 'org-spacer' }),
          el('button', { class: 'org-card', onclick: function () { openRecord(r); } },
            el('span', { class: 'avatar small', 'aria-hidden': 'true', text: initials(r.title) }),
            el('span', { class: 'grow' }, el('span', { class: 'cell-title', text: r.title }),
              el('span', { class: 'cell-sub', text: [p.position, p.area].filter(Boolean).join(', ') + (f.company ? '' : ' · ' + r.company) })),
            k.length ? el('span', { class: 'org-count', title: 'Personas a su cargo (directas e indirectas)', text: tree.size[r.id] }) : null)));
      if (open) li.appendChild(el('ul', null, k.map(function (c) { return node(c, depth + 1); })));
      return li;
    }
    if (needle.length >= 2 && !Object.keys(hits).length) box.appendChild(el('p', { class: 'notice info', text: 'Nadie coincide con "' + f.q.trim() + '".' }));
    if (tree.leaders.length) box.appendChild(el('section', { class: 'panel org' }, el('ul', { class: 'org-tree' }, tree.leaders.map(function (r) { return node(r, 0); }))));
    if (tree.loose.length) {
      var looseOpen = f.open.__loose || Object.keys(hits).some(function (id) { return tree.loose.some(function (r) { return r.id === id; }); });
      box.appendChild(el('section', { class: 'panel org' },
        el('button', { class: 'org-loose-head', 'aria-expanded': String(!!looseOpen), onclick: function () { f.open.__loose = !looseOpen; draw(); } },
          icon(looseOpen ? 'down' : 'right'), el('h2', { text: 'Sin jefe inmediato registrado' }), el('span', { class: 'org-count', text: tree.loose.length })),
        looseOpen ? el('ul', { class: 'org-tree' }, tree.loose.map(function (r) { return node(r, 0); })) : null,
        !looseOpen ? el('p', { class: 'cell-sub', text: 'Personas que no reportan a nadie del padrón y no tienen equipo a su cargo. Completa su jefe inmediato para ubicarlas.' }) : null));
    }
  }
  draw();

function drawCalendar(box, mod, rows) {
  var today = parseDay(S.boot.today);
  var cur = S.cal[mod.id] || { y: today.getFullYear(), m: today.getMonth() };
  S.cal[mod.id] = cur;
  var first = new Date(cur.y, cur.m, 1);
  var startDay = new Date(cur.y, cur.m, 1 - ((first.getDay() + 6) % 7));
  function shift(n) { var d = new Date(cur.y, cur.m + n, 1); S.cal[mod.id] = { y: d.getFullYear(), m: d.getMonth() }; renderMain(); }
  box.appendChild(el('div', { class: 'cal-head' },
    el('button', { class: 'icon-btn', 'aria-label': 'Mes anterior', onclick: function () { shift(-1); } }, icon('left')),
    el('h2', { text: MONTHS_LONG[cur.m] + ' ' + cur.y }),
    el('button', { class: 'icon-btn', 'aria-label': 'Mes siguiente', onclick: function () { shift(1); } }, icon('right')),
    el('button', { class: 'btn small', onclick: function () { S.cal[mod.id] = { y: today.getFullYear(), m: today.getMonth() }; renderMain(); } }, 'Hoy')));
  var grid = el('div', { class: 'cal', role: 'grid' });
  ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].forEach(function (d) { grid.appendChild(el('div', { class: 'dow', text: d })); });
  for (var i = 0; i < 42; i++) {
    var d = new Date(startDay.getFullYear(), startDay.getMonth(), startDay.getDate() + i);
    var iso = isoDay(d);
    var cell = el('div', { class: 'day' + (d.getMonth() !== cur.m ? ' out' : '') + (iso === S.boot.today ? ' today' : '') }, el('div', { class: 'd', text: d.getDate() }));
    var evs = rows.filter(function (r) { var s = r.payload.start || r.due, e = r.payload.end || s; return s && iso >= s.slice(0, 10) && iso <= e.slice(0, 10); });
    evs.slice(0, 3).forEach(function (r) {
      cell.appendChild(el('button', { class: 'ev' + (/Cancelad/.test(r.status) ? ' cancel' : ''), title: r.title, onclick: function () { openRecord(r); } },
        (r.payload.entry ? r.payload.entry + ' ' : '') + r.title));
    });
    if (evs.length > 3) cell.appendChild(el('div', { class: 'more', text: '+' + (evs.length - 3) + ' más' }));
    grid.appendChild(cell);
    if (i >= 34 && d.getMonth() !== cur.m && (i + 1) % 7 === 0) break;
  }
  box.appendChild(grid);
}

function downloadBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = el('a', { href: url, download: name });
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
function b64ToBlob(data, mime) {
  var bin = atob(data), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function exportCsv(mod) {
  var rows = recordsOf(mod.id);
  if (!rows.length) { toast('No hay registros para exportar.'); return; }
  var cols = [['Folio', function (r) { return r.folio; }], [mod.titleLabel, function (r) { return r.title; }], ['Empresa', function (r) { return r.company; }],
    ['Sede', function (r) { return r.site; }], ['Estado', function (r) { return r.status; }], ['Fecha compromiso', function (r) { return r.due; }],
    ['Responsable', function (r) { return r.owner; }]];
  mod.fields.forEach(function (f) { if (f.type !== 'letterhead') cols.push([f.label, function (r) { return r.payload[f.key]; }]); });
  if (mod.mode === 'inventario') cols.push(['Existencia actual', balanceOf]);
  cols.push(['Observaciones', function (r) { return r.notes; }], ['Actualizado', function (r) { return r.updatedAt; }]);
  var esc = function (v) { v = v === undefined || v === null ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var csv = [cols.map(function (c) { return esc(c[0]); }).join(',')].concat(rows.map(function (r) { return cols.map(function (c) { return esc(c[1](r)); }).join(','); })).join('\r\n');
  downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }), mod.id + '-' + S.boot.today + '.csv');
}

var NOM_SCALE = [['0', 'Siempre'], ['1', 'Casi siempre'], ['2', 'Algunas veces'], ['3', 'Casi nunca'], ['4', 'Nunca']];

function evalQuestions(p) {
  var E = S.boot.evaluations;
  if (!E || !p.instrument) return [];
  if (p.instrument !== 'nom035') return E.rubrics[p.instrument] || [];
  var list = E.nom035[p.guide] || [];
  var a = p.answers || {};
  if (p.guide === 'I') return list.filter(function (q) { return q.id === 0 || a['0'] === 'Sí'; });
  return list.filter(function (q) {
    if (p.guide === 'II') return q.id <= 40 || (q.id <= 43 ? !!p.customers : !!p.supervises);
    return q.id <= 64 || (q.id <= 68 ? !!p.customers : !!p.supervises);
  });
}

function saveDrawer(msg) {
  var d = S.drawer, mod = d.mod, f = d.form;
  msg.className = 'msg';
  msg.textContent = '';
  var missing = [];
  if (!f.title.trim()) missing.push(['f-title', mod.titleLabel]);
  if (!f.company) missing.push(['f-company', 'Empresa']);
  if (!f.site) missing.push(['f-site', 'Sede']);
  mod.fields.forEach(function (field) { if (field.required && !String(f.payload[field.key] || '').trim()) missing.push(['f-' + field.key, field.label]); });
  if (mod.id === 'evaluaciones' && !f.payload.instrument) missing.push(['f-instrument', 'Evaluación']);
  if (missing.length) {
    if (d.tab !== 'datos') { d.tab = 'datos'; renderDrawer(); msg = document.querySelector('.d-foot .msg'); }
    missing.forEach(function (m) { var n = document.getElementById(m[0]); if (n) n.classList.add('invalid'); });
    var first = document.getElementById(missing[0][0]);
    if (first) first.focus();
    msg.className = 'msg error';
    msg.textContent = 'Falta completar: ' + missing.map(function (m) { return m[1]; }).join(', ') + '.';
    return;
  }
  var btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  var input = { id: d.rec ? d.rec.id : '', revision: d.rec ? d.rec.revision : 0, kind: mod.id, title: f.title, company: f.company, site: f.site,
    status: f.status, owner: f.owner, due: f.due, notes: f.notes, payload: f.payload };
  var isNew = !d.rec;
  api('apiSave', input).then(function (saved) {
    var i = S.data.records.findIndex(function (r) { return r.id === saved.id; });
    if (i === -1) S.data.records.push(saved); else S.data.records[i] = saved;
    S.data.activity.unshift({ recordId: saved.id, kind: saved.kind, title: saved.title, action: isNew ? 'Registro creado' : 'Actualización', actor: S.boot.user.email, at: new Date().toISOString() });
    var pending = d.files.slice();
    S.drawer = { mod: mod, rec: saved, tab: 'datos', dirty: false, readOnly: false, files: [],
      form: { title: saved.title, company: saved.company, site: saved.site, status: saved.status, owner: saved.owner, due: saved.due, notes: saved.notes, payload: JSON.parse(JSON.stringify(saved.payload)) } };
    renderSide();
    renderMain();
    renderDrawer();
    toast(isNew ? mod.createdLabel + (saved.folio ? ' con folio ' + saved.folio : '') : 'Cambios guardados');
    if (pending.length) uploadFiles(saved, pending);
  }).catch(function (e) {
    btn.disabled = false;
    btn.textContent = isNew ? 'Crear ' + mod.singular : 'Guardar cambios';
    msg.className = 'msg error';
    msg.textContent = e.message;
  });
}

var ALLOWED = /\.(pdf|docx|xlsx|csv|png|jpg|jpeg|pptx|txt)$/i;

function drawFiles(body, d, attachments) {
  var ro = d.readOnly;
  if (!ro) {
    var input = el('input', { type: 'file', multiple: true, class: 'sr', id: 'file-in', accept: '.pdf,.docx,.xlsx,.csv,.png,.jpg,.jpeg,.pptx,.txt' });
    var drop = el('div', { class: 'drop' },
      el('p', null, 'Arrastra archivos aquí o ', el('label', { for: 'file-in', style: 'color:var(--brand-ink);text-decoration:underline;cursor:pointer', text: 'elígelos de tu equipo' }), '.'),
      el('p', { style: 'font-size:.82rem;color:var(--muted);margin-top:4px', text: 'PDF, Word, Excel, PowerPoint, CSV, TXT, PNG o JPG. Hasta 10 MB por archivo.' + (d.mod.id === 'membretadas' ? ' Para usarla como fondo de PDF, sube una imagen PNG o JPG tamaño carta.' : '') }),
      input);
    function take(list) {
      var files = Array.prototype.slice.call(list);
      var bad = files.filter(function (f) { return !ALLOWED.test(f.name) || f.size > 10485760; });
      if (bad.length) toast('No se agregó: ' + bad.map(function (f) { return f.name; }).join(', ') + '. Revisa el tipo y el tamaño.', 'error');
      files = files.filter(function (f) { return bad.indexOf(f) === -1; });
      if (!files.length) return;
      if (d.rec) uploadFiles(d.rec, files);
      else { d.files = d.files.concat(files); markDirty(); renderDrawer(); }
    }
    input.addEventListener('change', function () { take(input.files); });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (e) { e.preventDefault(); drop.classList.remove('over'); take(e.dataTransfer.files); });
    body.appendChild(drop);
  }
  if (!d.rec && d.files.length) body.appendChild(el('p', { class: 'notice info', style: 'margin-top:14px', text: 'Estos archivos se subirán al crear el registro.' }));
  var ul = el('ul', { class: 'files' });
  d.files.forEach(function (f, i) {
    ul.appendChild(el('li', null, icon('file'), el('div', { class: 'grow' }, el('div', { class: 'name', text: f.name }), el('div', { class: 'cell-sub', text: bytes(f.size) + ', pendiente' })),
      el('button', { class: 'icon-btn', 'aria-label': 'Quitar', onclick: function () { d.files.splice(i, 1); renderDrawer(); } }, icon('close'))));
  });
  attachments.forEach(function (a) {
    var mine = a.createdBy === S.boot.user.email || ['Dirección RH', 'Jefatura RH'].indexOf(S.boot.user.role) !== -1;
    ul.appendChild(el('li', null, icon('file'),
      el('div', { class: 'grow' }, el('div', { class: 'name', text: a.name }), el('div', { class: 'cell-sub', text: bytes(a.size) + ', ' + a.createdBy + ', ' + timeAgo(a.createdAt) })),
      el('button', { class: 'btn small', onclick: function () { downloadAttachment(a); } }, icon('download'), 'Descargar'),
      !ro && mine ? el('button', { class: 'icon-btn', 'aria-label': 'Eliminar archivo', title: 'Eliminar archivo', onclick: function () { removeAttachment(a); } }, icon('trash')) : null));
  });
  if (!attachments.length && !d.files.length) body.appendChild(el('p', { style: 'margin-top:14px;color:var(--muted)', text: 'Este registro no tiene archivos.' }));
  body.appendChild(ul);
}

function readAsBase64(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(String(reader.result).split(',')[1] || ''); };
    reader.onerror = function () { reject(new Error('No se pudo leer ' + file.name)); };
    reader.readAsDataURL(file);
  });
}

function uploadFiles(rec, files) {
  var done = 0;
  toast('Subiendo ' + files.length + (files.length === 1 ? ' archivo…' : ' archivos…'));
  return files.reduce(function (chain, file) {
    return chain.then(function () {
      return readAsBase64(file).then(function (data) {
        return api('apiUpload', rec.id, { name: file.name, mimeType: file.type, data: data });
      }).then(function (meta) {
        S.data.attachments.push(meta);
        done++;
      }).catch(function (e) { toast(file.name + ': ' + e.message, 'error'); });
    });
  }, Promise.resolve()).then(function () {
    if (done) toast(done === 1 ? 'Archivo guardado' : done + ' archivos guardados');
    if (S.drawer && S.drawer.rec && S.drawer.rec.id === rec.id) { S.drawer.tab = 'archivos'; renderDrawer(); }
  });
}

function downloadAttachment(a) {
  toast('Preparando descarga…');
  api('apiDownload', a.id).then(function (f) { downloadBlob(b64ToBlob(f.data, f.mimeType), f.name); }).catch(function (e) { toast(e.message, 'error'); });
}

function removeAttachment(a) {
  if (!confirm('¿Eliminar "' + a.name + '"? No se puede deshacer.')) return;
  api('apiDeleteAttachment', a.id).then(function () {
    S.data.attachments = S.data.attachments.filter(function (x) { return x.id !== a.id; });
    renderDrawer();
    toast('Archivo eliminado');
  }).catch(function (e) { toast(e.message, 'error'); });
}

function downloadPdf(r) {
  if (S.drawer && S.drawer.dirty) { toast('Guarda los cambios antes de descargar el PDF.', 'error'); return; }
  toast('Generando PDF…');
  api('apiPdf', r.id).then(function (f) { downloadBlob(b64ToBlob(f.data, 'application/pdf'), f.name); }).catch(function (e) { toast(e.message, 'error'); });
}

/* ---------- Historial y movimientos ---------- */

function drawHistory(body, d) {
  var box = el('div', null, el('p', { style: 'color:var(--muted)', text: 'Cargando historial…' }));
  body.appendChild(box);
  api('apiHistory', d.rec.id).then(function (items) {
    clear(box);
    if (!items.length) { box.appendChild(el('p', { text: 'Sin movimientos registrados.' })); return; }
    box.appendChild(el('ul', { class: 'timeline' }, items.map(function (h) {
      var dt = new Date(h.at);
      return el('li', null, el('div', { text: h.action }),
        el('div', { class: 'when', text: h.actor + ', ' + dt.getDate() + ' ' + MONTHS[dt.getMonth()] + ' ' + dt.getFullYear() + ' a las ' + String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0') }));
    })));
  }).catch(function (e) { clear(box).appendChild(el('p', { class: 'msg error', text: e.message })); });
}

function drawMovements(body, d) {
  var list = S.data.movements.filter(function (m) { return m.recordId === d.rec.id; }).sort(function (a, b) { return a.at < b.at ? 1 : -1; });
  body.appendChild(el('div', { class: 'notice info', text: 'Existencia actual: ' + balanceOf(d.rec) + ' piezas.' }));
  if (canWriteRecord(d.rec) && d.rec.status === 'Activo') body.appendChild(el('button', { class: 'btn', style: 'margin-bottom:14px', onclick: function () { openMovement(d.rec); } }, icon('box'), 'Registrar entrada o salida'));
  if (!list.length) { body.appendChild(el('p', { style: 'color:var(--muted)', text: 'Aún no hay entradas ni salidas.' })); return; }
  body.appendChild(el('div', { class: 'table-wrap' }, el('table', { class: 'list' },
    el('thead', null, el('tr', null, ['Fecha', 'Movimiento', 'Cantidad', 'Recibe', 'Registró'].map(function (h) { return el('th', { text: h }); }))),
    el('tbody', null, list.map(function (m) {
      return el('tr', { style: 'cursor:default' }, el('td', { text: fmtDate(m.at.slice(0, 10)) }), el('td', { text: m.type }),
        el('td', { class: 'num', text: (m.type === 'Salida' ? '−' : '+') + m.quantity }), el('td', { text: m.recipient || '' }), el('td', { text: m.actor }));
    })))));
}

/* ---------- Ventanas modales ---------- */

function openModal(title, content, actions) {
  var root = clear(document.getElementById('modal-root'));
  root.appendChild(el('div', { class: 'scrim', style: 'z-index:55', onclick: closeModal }));
  var box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, el('h2', { text: title }), el('div', { class: 'stack' }, content), el('div', { class: 'row-actions' }, actions));
  root.appendChild(box);
  var f = box.querySelector('input, select, textarea');
  if (f) f.focus();
}
function closeModal() { clear(document.getElementById('modal-root')); }

function openMovement(r) {
  var type = 'Salida';
  var seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Tipo de movimiento' });
  ['Entrada', 'Salida'].forEach(function (t) {
    seg.appendChild(el('button', { type: 'button', 'aria-pressed': String(t === type), onclick: function () {
      type = t; Array.prototype.forEach.call(seg.children, function (b) { b.setAttribute('aria-pressed', String(b.textContent === t)); });
      who.parentNode.style.display = t === 'Salida' ? '' : 'none';
    } }, t));
  });
  var qty = el('input', { class: 'input', type: 'number', min: '1', value: '1', inputmode: 'numeric' });
  var who = el('input', { class: 'input', placeholder: 'Nombre del colaborador', list: 'dl-staff' });
  var dl = el('datalist', { id: 'dl-staff' }, recordsOf('colaboradores').filter(function (c) { return c.status === 'Activo'; }).map(function (c) { return el('option', { value: c.title }); }));
  var notes = el('input', { class: 'input', placeholder: 'Factura, motivo o comentario' });
  var save = el('button', { class: 'btn primary' }, 'Registrar');
  save.addEventListener('click', function () {
    save.disabled = true;
    api('apiMovement', { id: r.id, type: type, quantity: qty.value, recipient: who.value, notes: notes.value }).then(function (res) {
      r.payload.balance = res.balance;
      r.revision = res.revision;
      S.data.movements.push({ id: String(Date.now()), recordId: r.id, type: type, quantity: Number(qty.value), recipient: who.value, notes: notes.value, actor: S.boot.user.email, at: new Date().toISOString() });
      closeModal();
      if (S.drawer && S.drawer.rec && S.drawer.rec.id === r.id) { S.drawer.rec = r; renderDrawer(); }
      renderMain();
      toast(type + ' registrada. Existencia: ' + res.balance + ' piezas.');
    }).catch(function (e) { save.disabled = false; toast(e.message, 'error'); });
  });
  openModal(r.title + ', talla ' + (r.payload.size || '—'), [
    el('p', { text: 'Existencia actual: ' + balanceOf(r) + ' piezas.' }), seg,
    el('label', { class: 'field' }, 'Cantidad', qty),
    el('label', { class: 'field' }, 'Quién recibe', who, dl),
    el('label', { class: 'field' }, 'Notas', notes),
  ], [el('button', { class: 'btn ghost', onclick: closeModal }, 'Cancelar'), save]);
}

/* ---------- Usuarios y permisos ---------- */

var ROLE_HELP = {
  'Dirección RH': 'Todo el alcance asignado, incluidos documentos comunes, evaluaciones e incapacidades. Puede eliminar registros.',
  'Jefatura RH': 'Todos los módulos de su alcance, incluidas evaluaciones (NOM-035) e incapacidades. Concilia inventarios.',
  'Generalista RH': 'Módulos de su alcance, incluidas incapacidades. No ve evaluaciones individuales.',
  'Reclutamiento': 'Candidatos, cobertura de vacantes, perfiles de puesto y procesos.',
  'Capacitación': 'Calendario de capacitaciones y procesos.',
  'Consulta': 'Lee y descarga. No ve salarios, incapacidades ni evaluaciones, y no modifica nada.',
};

function viewAdmin(page) {
  page.appendChild(el('div', { class: 'page-head' }, el('div', null, el('h1', { text: 'Usuarios y permisos' }),
    el('p', { class: 'lead', text: 'Define quién entra, con qué rol y en qué empresas y sedes. Los permisos se aplican en el servidor: cada persona solo recibe la información de su alcance.' })),
    el('div', { class: 'actions' }, el('button', { class: 'btn primary', onclick: function () { openUser(null); } }, icon('plus'), 'Agregar persona'))));
  var box = el('div', null, el('p', { text: 'Cargando…' }));
  page.appendChild(box);
  api('apiAccessList').then(function (res) {
    S.access = res;
    clear(box);
    if (!res.users.length) {
      box.appendChild(el('div', { class: 'empty' }, el('h2', { text: 'Aún no hay personas registradas' }),
        el('p', { text: 'Agrega al equipo con su correo de Google de la empresa y asígnales un rol.' }),
        el('button', { class: 'btn primary', onclick: function () { openUser(null); } }, icon('plus'), 'Agregar persona')));
      return;
    }
    var tbody = el('tbody');
    res.users.forEach(function (u) {
      var editable = res.titular || !u.admin;
      tbody.appendChild(el('tr', { tabindex: '0', onclick: function () { if (editable) openUser(u); } },
        el('td', null, el('div', { class: 'cell-title', text: u.name }), el('div', { class: 'cell-sub', text: u.email })),
        el('td', null, el('div', { text: u.role }), u.admin ? el('div', { class: 'cell-sub', text: 'Administra accesos' }) : null),
        el('td', null, el('div', { class: 'scope', text: (u.companies.indexOf('*') !== -1 ? 'Todas las empresas' : u.companies.join(', ')) + '. ' + (u.sites.indexOf('*') !== -1 ? 'Todas las sedes' : u.sites.join(', ')) + '.' })),
        el('td', null, badge(u.active ? 'Activo' : 'Baja'))));
    });
    box.appendChild(el('div', { class: 'table-wrap users' }, el('table', { class: 'list' },
      el('thead', null, el('tr', null, ['Persona', 'Rol', 'Alcance', 'Acceso'].map(function (h) { return el('th', { text: h }); }))), tbody)));
  }).catch(function (e) { clear(box).appendChild(el('p', { class: 'msg error', text: e.message })); });
  if (S.boot.user.titular) page.appendChild(importPanel());
}

/* ---------- Importar la versión anterior (solo titular) ---------- */

function importPanel() {
  var cat = S.boot.catalog;
  var src = el('input', { class: 'input', id: 'imp-src', type: 'url', placeholder: 'https://docs.google.com/spreadsheets/d/…' });
  var comp = el('select', { class: 'input', id: 'imp-comp' });
  cat.companies.forEach(function (c) { comp.appendChild(el('option', { value: c, text: c })); });
  var site = el('select', { class: 'input', id: 'imp-site' });
  cat.sites.forEach(function (s) { site.appendChild(el('option', { value: s, text: s, selected: s === 'San José del Cabo' })); });
  var out = el('div', { class: 'import-out', role: 'status' });
  var checkBtn = el('button', { class: 'btn', onclick: function () { run(false); } }, 'Revisar');
  var LABELS = { empleados: 'Empleados → Padrón de colaboradores', solicitudes: 'Solicitudes → Permisos y vacaciones', vacantes: 'Vacantes → Cobertura de vacantes' };

  function run(commit) {
    var input = { source: src.value.trim(), company: comp.value, site: site.value, commit: commit };
    clear(out).appendChild(el('p', { class: 'cell-sub', text: commit ? 'Importando…' : 'Revisando la hoja…' }));
    checkBtn.disabled = true;
    api('apiImportLegacy', input).then(function (res) {
      checkBtn.disabled = false;
      clear(out);
      if (res.committed) {
        out.appendChild(el('div', { class: 'notice info', text: 'Listo: se importaron ' + res.total + ' registros. Revisa los avisos y completa los datos que falten en cada módulo.' }));
        reload(true);
      } else if (!res.total) {
        out.appendChild(el('div', { class: 'notice info', text: 'No hay registros nuevos por importar' + (Object.keys(res.summary).length ? ': todo lo de esta hoja ya está en la intranet.' : '.') }));
      }
      var tbody = el('tbody');
      Object.keys(LABELS).forEach(function (k) {
        var t = res.summary[k] || { nuevos: 0, yaImportados: 0, omitidos: 0 };
        tbody.appendChild(el('tr', null, el('td', { text: LABELS[k] + (res.tabs[k] === null ? ' (pestaña no encontrada)' : '') }),
          el('td', { class: 'num', text: t.nuevos }), el('td', { class: 'num', text: t.yaImportados }), el('td', { class: 'num', text: t.omitidos })));
      });
      out.appendChild(el('div', { class: 'table-wrap' }, el('table', { class: 'list' },
        el('thead', null, el('tr', null, ['Pestaña', res.committed ? 'Importados' : 'Por importar', 'Ya importados', 'Omitidos'].map(function (h) { return el('th', { text: h }); }))), tbody)));
      if (res.warnings.length) {
        out.appendChild(el('p', { style: 'margin-top:12px;font-weight:600', text: 'Avisos (' + res.warnings.length + ')' }));
        out.appendChild(el('ul', null, res.warnings.map(function (w) { return el('li', { text: w }); })));
      }
      if (!res.committed && res.total) {
        out.appendChild(el('div', { class: 'quick', style: 'margin-top:14px' },
          el('button', { class: 'btn primary', onclick: function (e) { e.target.disabled = true; run(true); } }, 'Importar ' + res.total + ' registros')));
      }
    }).catch(function (e) {
      checkBtn.disabled = false;
      clear(out).appendChild(el('p', { class: 'msg error', text: e.message }));
    });
  }

  return el('section', { class: 'panel', style: 'margin-top:24px' },
    el('h2', { text: 'Importar datos de la versión anterior' }),
    el('p', { class: 'cell-sub', style: 'margin-bottom:12px', text: 'Trae las pestañas Empleados, Solicitudes y Vacantes de la intranet anterior. Primero se revisa sin guardar nada; puedes repetirlo sin duplicar registros. La sede del archivo se respeta cuando existe en el catálogo.' }),
    el('div', { class: 'import-grid' },
      el('label', { class: 'field', for: 'imp-src' }, 'Enlace de la hoja anterior', src),
      el('label', { class: 'field', for: 'imp-comp' }, 'Empresa', comp),
      el('label', { class: 'field', for: 'imp-site' }, 'Sede por omisión', site),
      checkBtn),
    out);
}

function openUser(u) {
  var cat = S.boot.catalog, titular = S.access && S.access.titular;
  var form = u ? JSON.parse(JSON.stringify(u)) : { name: '', email: '', role: 'Generalista RH', companies: [], sites: [], active: true, admin: false };
  var root = clear(document.getElementById('drawer-root'));
  var body = el('div', { class: 'd-body' });
  var msg = el('p', { class: 'msg' });
  var name = el('input', { class: 'input', value: form.name });
  name.addEventListener('input', function () { form.name = name.value; });
  var email = el('input', { class: 'input', type: 'email', value: form.email, readOnly: !!u, placeholder: 'nombre@empresa.com' });
  email.addEventListener('input', function () { form.email = email.value; });
  var role = el('select', { class: 'input' });
  cat.roles.forEach(function (r) { role.appendChild(el('option', { value: r, text: r, selected: r === form.role })); });
  var help = el('p', { class: 'role-help', text: ROLE_HELP[form.role] });
  var adminBox = el('div');
  function drawAdmin() {
    clear(adminBox);
    if (!titular) return;
    var capable = cat.adminRoles.indexOf(form.role) !== -1;
    if (!capable) form.admin = false;
    var cb = el('input', { type: 'checkbox', checked: form.admin, disabled: !capable });
    cb.addEventListener('change', function () { form.admin = cb.checked; });
    adminBox.appendChild(el('label', { class: 'check' + (capable ? '' : ' muted') }, cb, 'Puede administrar accesos' + (capable ? '' : ' (solo Dirección o Jefatura RH)')));
  }
  role.addEventListener('change', function () { form.role = role.value; help.textContent = ROLE_HELP[form.role]; drawAdmin(); });
  drawAdmin();
  var active = el('input', { type: 'checkbox', checked: form.active });
  active.addEventListener('change', function () { form.active = active.checked; });

  function picklist(key, options, label) {
    var wrap = el('div', { class: 'picklist', role: 'group', 'aria-label': label });
    function draw() {
      clear(wrap);
      ['*'].concat(options).forEach(function (o) {
        var cb = el('input', { type: 'checkbox', checked: form[key].indexOf(o) !== -1 });
        cb.addEventListener('change', function () {
          if (o === '*') form[key] = cb.checked ? ['*'] : [];
          else form[key] = cb.checked ? form[key].filter(function (x) { return x !== '*'; }).concat(o) : form[key].filter(function (x) { return x !== o; });
          draw();
        });
        wrap.appendChild(el('label', { class: 'check' }, cb, o === '*' ? (key === 'companies' ? 'Todas las empresas' : 'Todas las sedes') : o));
      });
    }
    draw();
    return wrap;
  }

  body.appendChild(el('div', { class: 'section' }, el('h3', { text: 'Persona' }), el('div', { class: 'grid2' },
    el('label', { class: 'field' }, 'Nombre', name),
    el('label', { class: 'field' }, el('span', null, 'Correo de Google ', el('span', { class: 'hint', text: '(con el que entra)' })), email))));
  body.appendChild(el('div', { class: 'section' }, el('h3', { text: 'Rol' }), el('div', { class: 'grid2' },
    el('label', { class: 'field' }, 'Rol', role), el('div', { style: 'display:flex;flex-direction:column;gap:10px;justify-content:flex-end' },
      el('label', { class: 'check' }, active, 'Acceso activo'), adminBox), el('div', { class: 'wide' }, help))));
  body.appendChild(el('div', { class: 'section' }, el('h3', { text: 'Empresas' }), picklist('companies', cat.companies, 'Empresas')));
  body.appendChild(el('div', { class: 'section' }, el('h3', { text: 'Sedes' }),
    el('p', { style: 'font-size:.86rem;color:var(--ink-2);margin-bottom:8px', text: 'Caribe, Vallarta y Nayarit agrupan varias sedes: quien las tiene ve y edita las sedes que contienen.' }),
    picklist('sites', cat.sites, 'Sedes')));

  var save = el('button', { class: 'btn primary' }, u ? 'Guardar permisos' : 'Agregar persona');
  save.addEventListener('click', function () {
    msg.className = 'msg'; msg.textContent = '';
    if (!form.name.trim() || !form.email.trim() || !form.companies.length || !form.sites.length) {
      msg.className = 'msg error';
      msg.textContent = 'Completa nombre, correo, al menos una empresa y al menos una sede.';
      return;
    }
    save.disabled = true;
    api('apiAccessSave', form).then(function () {
      clear(document.getElementById('drawer-root'));
      toast(u ? 'Permisos guardados' : 'Persona agregada. Ya puede entrar con su cuenta.');
      renderMain();
    }).catch(function (e) { save.disabled = false; msg.className = 'msg error'; msg.textContent = e.message; });
  });
  var closeIt = function () { clear(document.getElementById('drawer-root')); };
  root.appendChild(el('div', { class: 'scrim', onclick: closeIt }));
  root.appendChild(el('aside', { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Permisos' },
    el('div', { class: 'd-head', style: 'padding-bottom:16px' }, el('div', { class: 'row' },
      el('div', { style: 'flex:1' }, el('div', { class: 'kicker', text: 'Usuarios y permisos' }), el('h2', { text: u ? u.name : 'Agregar persona' })),
      el('button', { class: 'icon-btn', 'aria-label': 'Cerrar', onclick: closeIt }, icon('close')))),
    body,
    el('div', { class: 'd-foot' }, save, el('span', { class: 'spacer' }), el('button', { class: 'btn ghost', onclick: closeIt }, 'Cancelar'), msg)));
  name.focus();
}

start();
</script>
